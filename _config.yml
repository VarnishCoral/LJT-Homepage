title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Ph.D. candidate in Computer Science at the HKUST NLP Group, Hong Kong University of Science and Technology. Research focuses on natural language processing and machine learning."
url: https://VarnishCoral.github.io
baseurl: "/LJT-Homepage"
repository: "VarnishCoral/LJT-Homepage"
locale: "en-US"
site_theme: "default"

# Reading Files
include:
  - .htaccess
  - _pages
  - files

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  sass_dir: _sass
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Default Front Matter
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

# Author sidebar (only fields provided in memory are filled in)
author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "Ph.D. Candidate, HKUST NLP Group"
  employer: "HKUST NLP Group, Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Publication categories are disabled so all publications are listed together.
publication_category:
